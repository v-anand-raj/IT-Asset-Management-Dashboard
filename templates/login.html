<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #d8b4fe, #f9a8d4);
      }

      .login-box {
        width: 380px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .login-box h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #4b0082;
      }

      .login-box p {
        text-align: center;
        margin-bottom: 30px;
        color: gray;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
      }

      .input-group input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: #c084fc;
        box-shadow: 0 0 8px rgba(192, 132, 252, 0.4);
      }

      .password-container {
        position: relative;
      }

      .password-container input {
        width: 100%;
        padding-right: 45px;
      }

      .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 18px;
        user-select: none;
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, #a855f7, #ec4899);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-btn:hover {
        transform: scale(1.03);
        opacity: 0.95;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h1>Welcome Back</h1>

      <p>Please login to continue</p>

      <form action="/login" method="POST">
        <div class="input-group">
          <label>Name</label>

          <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="input-group">
          <label>Personal Number / Staff Number</label>

          <div class="password-container">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your number"
              required
            />

            <span class="toggle-password" onclick="togglePassword()"> 👁 </span>
          </div>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      }
    </script>
  </body>
</html>
